<!--
  Helm nav-bar logo — transparent background, full-detail wheel in coral.
  Designed for 28–36px rendered height on the dark (#141413) header.
  Full detail (outer ring + inner ring + 8 spokes) reads well at these sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="none" stroke="#d97757" stroke-width="3.2" stroke-linecap="round">
    <circle cx="50" cy="50" r="32"/>
    <circle cx="50" cy="50" r="9"/>
    <!-- 8 spokes: inner r=12 → outer r=44 -->
    <line x1="62"   y1="50"   x2="94"   y2="50"/>
    <line x1="58.5" y1="58.5" x2="81.1" y2="81.1"/>
    <line x1="50"   y1="62"   x2="50"   y2="94"/>
    <line x1="41.5" y1="58.5" x2="18.9" y2="81.1"/>
    <line x1="38"   y1="50"   x2="6"    y2="50"/>
    <line x1="41.5" y1="41.5" x2="18.9" y2="18.9"/>
    <line x1="50"   y1="38"   x2="50"   y2="6"/>
    <line x1="58.5" y1="41.5" x2="81.1" y2="18.9"/>
  </g>
  <circle cx="50" cy="50" r="2.2" fill="#d97757"/>
</svg>
