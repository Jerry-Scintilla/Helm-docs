site_name: Helm
site_description: EVE Online Open-Source Fleet Management Platform — Plugin Architecture, High Extensibility
site_url: https://Jerry-Scintilla.github.io/helm-docs/
repo_url: https://github.com/Jerry-Scintilla/helm
repo_name: helm
edit_uri: ""
copyright: >
  Copyright &copy; 2024 Helm Contributors —
  <a href="https://www.gnu.org/licenses/old-licenses/gpl-2.0.html">GPL-2.0 License</a>

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: false
    code: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          theme:
            language: zh
            palette:
              - scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: 切换深色模式
              - scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: 切换浅色模式
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            概览: Overview
            什么是 Helm: What is Helm
            功能特性: Features
            系统架构: Architecture
            快速开始: Getting Started
            安装部署: Installation
            配置参考: Configuration
            用户指南: User Guide
            概述: Overview
            EVE SSO 登录: EVE SSO Login
            控制台: Dashboard
            角色管理: Character Management
            军团管理: Corporation Management
            联盟管理: Alliance Management
            管理员指南: Admin Guide
            插件管理: Plugin Management
            用户与权限: Users & Permissions
            后台任务: Background Tasks
            市场物价服务: Market Price Service
            插件开发: Plugin Development
            指南索引: Guide Index
            1. 概念速览: "1. Concepts Overview"
            2. 最小可工作插件: "2. Minimal Plugin"
            3. 包结构与入口点: "3. Package Structure"
            4. HelmPlugin 类参考: "4. HelmPlugin Reference"
            5. 生命周期钩子: "5. Lifecycle Hooks"
            6. 注册 API 路由: "6. Register API Routes"
            7. 注册权限: "7. Register Permissions"
            8. 注册 Celery 任务: "8. Register Celery Tasks"
            9. ESI 作用域声明: "9. ESI Scope Declaration"
            10. 侧边栏菜单: "10. Sidebar Menu"
            11. iframe 前端: "11. iframe Frontend"
            12. 插件数据库迁移: "12. Plugin Database Migration"
            13. 插件间通信: "13. Plugin Communication"
            14. 本地测试流程: "14. Local Testing"
            15. 发布到 PyPI: "15. Publish to PyPI"
            16. API 端点参考: "16. API Endpoints Reference"
            17. 角色模块扩展: "17. Character Module Extension"
            API 参考: API Reference
            下载: Downloads

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

